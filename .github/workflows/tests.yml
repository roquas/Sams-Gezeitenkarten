name: Tests
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify no-cache development HTTP semantics
        run: python3 scripts/dev-server.py --self-test
      - run: npm run test:unit
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify alpha artifact normalizer safety
        run: |
          python3 -m pip install --user Pillow numpy
          python3 scripts/normalize-chart-alpha.py --self-test
      - name: Validate sea and both parchment frames
        run: |
          python3 -m pip install --user Pillow numpy
          python3 scripts/check-chart-assets.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --config playwright.webkit.config.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-chart-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
