name: Rapid place animation investigation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - name: Native replacement timeline probe
        run: npx playwright test --config playwright.webkit.config.mjs tests/browser/rapid-minimal-probe.spec.mjs --retries=0 --trace=on --output=probe-results
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: probe-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapid-place-animation-minimal
          retention-days: 3
          path: |
            original-results/
            original-results.json
            probe-results/
            probe-results.json
