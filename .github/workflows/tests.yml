name: Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install image validation dependency for publication unit checks
        run: python3 -m pip install --user Pillow
      - name: Verify no-cache development HTTP semantics
        run: python3 scripts/dev-server.py --self-test
      - run: npm run test:unit
      - run: npm run test:content
      - run: npm run test:puzzles
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install asset validation dependencies
        run: python3 -m pip install --user Pillow numpy
      - name: Verify alpha artifact normalizer safety
        run: |
          python3 scripts/normalize-chart-alpha.py --self-test
      - name: Validate sea and both parchment frames
        run: |
          python3 scripts/check-chart-assets.py
      - name: Validate asset catalog, approval hashes and local image footprints
        run: npm run test:assets
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Retain UI review screenshots and lifecycle observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-safari-review-chromium
          path: |
            test-results/**/ink-*.png
            test-results/**/status-*.png
            test-results/**/frame-choice-*.png
            test-results/**/resume-lifecycle.json
            test-results/**/cold-chart-timeline.json
          if-no-files-found: ignore
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3

  webkit:
    # One software-rendering worker per runner avoids the DPR-2 contention
    # observed with two workers. Shards still execute the complete test matrix.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: webkit-results.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --config playwright.webkit.config.mjs --shard=${{ matrix.shard }}/6
      - name: Retain WebKit timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-timings-${{ matrix.shard }}
          path: |
            webkit-results.json
            webkit-test-results/**/ink-*.png
            webkit-test-results/**/status-*.png
            webkit-test-results/**/frame-choice-*.png
            webkit-test-results/**/resume-lifecycle.json
            webkit-test-results/**/cold-chart-timeline.json
          if-no-files-found: error
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-chart-report-${{ matrix.shard }}
          path: |
            playwright-report/
            webkit-test-results/
          if-no-files-found: ignore
          retention-days: 3

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install mandatory publication image validator
        run: python3 -m pip install --user Pillow
      - run: python3 tests/test_package.py
      - run: sh scripts/package.sh
      - name: Extract actual release ZIP outside the checkout
        run: |
          site=$(mktemp -d)
          python3 -m zipfile -e dist/Sams-Gezeitenkarten.zip "$site"
          echo "DEPLOY_ROOT=$site" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config playwright.deployment.config.mjs
      - name: Retain deployment UI review and lifecycle observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-safari-review-deployment
          path: |
            deployment-test-results/**/ink-*.png
            deployment-test-results/**/status-*.png
            deployment-test-results/**/resume-lifecycle.json
            deployment-test-results/**/cold-chart-timeline.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Retain directly deployable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: static-deployment
          path: dist/Sams-Gezeitenkarten.zip
          if-no-files-found: error
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-failure
          path: |
            deployment-report/
            deployment-test-results/
          if-no-files-found: ignore
          retention-days: 3
