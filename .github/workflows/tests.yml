name: Place animation fixed regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - name: Native playback and deterministic phases
        run: npx playwright test --config playwright.webkit.config.mjs tests/browser/place-references.spec.mjs --grep 'normal fade|own timeline' --retries=0 --trace=on --output=fixed-results
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: fixed-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: place-animation-fixed
          retention-days: 3
          path: |
            fixed-results/
            fixed-results.json
