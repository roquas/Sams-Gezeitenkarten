name: Diagnose WebKit regressions
on:
  workflow_dispatch:
    inputs:
      actionability:
        description: Compare unchanged selection assertions and frame timing on Linux WebKit
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  diagnose:
    if: ${{ !inputs.actionability }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - name: Check native mobile navigation and overlay review
        run: npx playwright test --config playwright.webkit.config.mjs --project webkit-mobile --grep "actual polished controls and expanded rules screenshots at 390px|actual mobile overlay and rules screenshots" --output webkit-viewport-results
      - name: Check frame reload and touch protocols before the full WebKit suite
        run: npx playwright test --config playwright.webkit.config.mjs --grep "visible frame choice|one mouse or touch drag|mobile swipe turns|chart labels sit in parchment|erasing all hours|overwriting and erasing|manifest puzzle|switch and reload isolate|reset after reload|selected puzzle|compact controls and centered radar|actual polished controls|mobile overview shows every clue|mobile overview keeps navigation|actual browser screenshot for coordinate|actual mobile overlay and rules screenshots|tablet settings" --output webkit-smoke-results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-diagnostics
          path: |
            playwright-report/
            webkit-results.json
            webkit-smoke-results/
            webkit-viewport-results/
          if-no-files-found: ignore
          retention-days: 3
  actionability:
    if: ${{ inputs.actionability }}
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, frames, reduced-motion, dpr1, single-load]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - run: node scripts/diagnose-webkit-actionability.mjs ${{ matrix.variant }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actionability-${{ matrix.variant }}
          path: actionability-results/
          if-no-files-found: error
          retention-days: 3
